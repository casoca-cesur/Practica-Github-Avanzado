on: 
  push:
    branches: 
      - develop
  pull_request:
      branches:
        - develop
  workflow_dispatch:
  
jobs: 
  hosted-first:
    runs-on: ubuntu-latest
    steps: 
      - name: Clonar repositorio
        run: git clone https://github.com/casoca-cesur/Practica-Github-Avanzado.git
      - name: Entrar en github
        run: git config --global user.name "casoca-cesur" && git config --global user.email "carmen.s607893@cesurformacion.com"
      - name: Añadir cambio
        run: 'cd Practica-Github-Avanzado && echo "Añadida feature: $GITHUB_REF_NAME" >> README.md'
      - name: Subir cambios
        run: cd Practica-Github-Avanzado && git add README.md && git commit -m "Cambio en README" && git push


  second:
    runs-on: self-hosted
    needs: hosted-first
    steps:
      - name: Validar secret
        env:
          GH_DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
          shell: powershell
        run: | 
            if ($env:GH_SECRET_DEV -eq $env:LOCAL_DEV_TOKEN) {
            Write-Output "Los tokens coinciden"
            } else {
            Write-Output "Los tokens no coinciden."
            exit 1
            }
